version: '3.8'

# Produccion: Postgres + Backend + Frontend (Nginx).
#
# OPCION A — Usar imagenes pre-construidas de GHCR (recomendado para producción):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# OPCION B — Construir localmente (desarrollo):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Variables requeridas en .env.prod:
#   DB_USERNAME, DB_PASSWORD, DB_DATABASE
#   JWT_SECRET (min 16 chars, usar: openssl rand -hex 32)
#
# Variables opcionales:
#   PORT, DB_PORT, CORS_ORIGIN, JWT_EXPIRES_IN, JWT_REFRESH_EXPIRES_IN
#   THROTTLE_TTL, THROTTLE_LIMIT, LOG_LEVEL
#   UPLOAD_MAX_BYTES, COVER_MAX_BYTES, MAX_ATTACHMENTS_PER_EVENT
#   CACHE_TTL_DEFAULT, CACHE_MAX, UNSPLASH_ACCESS_KEY
#   # Si usas imagenes de GHCR:
#   BACKEND_IMAGE, FRONTEND_IMAGE (ej: ghcr.io/user/repo/backend:development)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-church-management-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      COVER_MAX_BYTES: ${COVER_MAX_BYTES:-10485760}
      MAX_ATTACHMENTS_PER_EVENT: ${MAX_ATTACHMENTS_PER_EVENT:-10}
      CACHE_TTL_DEFAULT: ${CACHE_TTL_DEFAULT:-60000}
      CACHE_MAX: ${CACHE_MAX:-500}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    expose:
      - '${PORT:-3000}'

  frontend:
    image: ${FRONTEND_IMAGE:-church-management-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - '80:80'
    restart: unless-stopped

volumes:
  postgres_prod_data:
  uploads_data: