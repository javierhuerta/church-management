version: '3.8'

# Entorno de produccion: Postgres + Backend + Frontend (Nginx).
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Variables requeridas en .env.prod (o como env vars del sistema):
#   DB_USERNAME, DB_PASSWORD, DB_DATABASE
#   JWT_SECRET (min 16 chars, usar: openssl rand -hex 32)
#
# Variables opcionales (tienen defaults razonables):
#   PORT, DB_PORT, CORS_ORIGIN, JWT_EXPIRES_IN, JWT_REFRESH_EXPIRES_IN
#   THROTTLE_TTL, THROTTLE_LIMIT, LOG_LEVEL
#   UPLOAD_MAX_BYTES, COVER_MAX_BYTES, MAX_ATTACHMENTS_PER_EVENT
#   CACHE_TTL_DEFAULT, CACHE_MAX, UNSPLASH_ACCESS_KEY

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      # Database
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # CORS — en prod el frontend va en el mismo origen via Nginx, no se necesita CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # Rate limiting
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      # Uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      COVER_MAX_BYTES: ${COVER_MAX_BYTES:-10485760}
      MAX_ATTACHMENTS_PER_EVENT: ${MAX_ATTACHMENTS_PER_EVENT:-10}
      # Cache
      CACHE_TTL_DEFAULT: ${CACHE_TTL_DEFAULT:-60000}
      CACHE_MAX: ${CACHE_MAX:-500}
      # Unsplash (opcional)
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    # El backend no expone puerto directamente — Nginx hace el proxy
    expose:
      - '${PORT:-3000}'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - '80:80'
    restart: unless-stopped

volumes:
  postgres_prod_data:
  uploads_data:
