name: Build and Deploy

# main -> produccion, development -> staging (ambos en Dokploy).
# El CI construye y publica las imagenes en GHCR; Dokploy solo hace pull + up.
on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  DOKPLOY_URL: https://dokploy-op.unach.app

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, website]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo lo usa el Dockerfile del website (cache-busting de assets).
          build-args: |
            ASSET_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Usa el webhook del servicio Compose en Dokploy, no la API key del panel:
  # el refreshToken solo puede desplegar ESE servicio, mientras que la API key da
  # control total de la instancia. El servicio debe tener "Auto Deploy" activo,
  # si no el webhook responde 400.
  #
  # Secrets del repositorio (solo el token, no la URL completa):
  #   DOKPLOY_WEBHOOK_TOKEN_PROD     (rama main)
  #   DOKPLOY_WEBHOOK_TOKEN_STAGING  (rama development)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'

    steps:
      - name: Trigger Dokploy deploy
        # Se elige el token en shell y no con `cond && A || B`: esa expresion cae a B
        # cuando A esta vacio, y un push a main desplegaria staging sin fallar.
        env:
          TOKEN_PROD: ${{ secrets.DOKPLOY_WEBHOOK_TOKEN_PROD }}
          TOKEN_STAGING: ${{ secrets.DOKPLOY_WEBHOOK_TOKEN_STAGING }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)        DOKPLOY_WEBHOOK_TOKEN="$TOKEN_PROD";    secret=DOKPLOY_WEBHOOK_TOKEN_PROD ;;
            refs/heads/development) DOKPLOY_WEBHOOK_TOKEN="$TOKEN_STAGING"; secret=DOKPLOY_WEBHOOK_TOKEN_STAGING ;;
          esac
          if [ -z "$DOKPLOY_WEBHOOK_TOKEN" ]; then
            echo "::error::Falta el secret $secret con el refreshToken del servicio en Dokploy."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            --max-time 30 --retry 3 --retry-connrefused \
            -H 'Content-Type: application/json' \
            "${DOKPLOY_URL}/api/deploy/compose/${DOKPLOY_WEBHOOK_TOKEN}")
          echo "Dokploy respondio HTTP $code"
          # 400 = Auto Deploy desactivado en el servicio. 404 = refreshToken invalido.
          test "$code" = "200"
