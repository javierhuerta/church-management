# Iglesia Osorno Central — Dokploy (Postgres + Backend + Frontend admin + Website + Backup)
# Servicio Dokploy tipo Compose / Source: Raw — este contenido se pega en el panel.
# Las imagenes las construye el CI (GitHub Actions) y Dokploy solo hace pull + up.
#
# Un mismo archivo sirve para produccion y staging; solo cambian las variables de
# entorno del servicio (pestana Environment del panel):
#   produccion (rama main):        BACKEND_IMAGE/FRONTEND_IMAGE/WEBSITE_IMAGE con tag :main
#   staging (rama development):    las mismas imagenes con tag :development
#   Imagenes: ghcr.io/javierhuerta/church-management/{backend,frontend,website}
#
# Variables requeridas: DB_USERNAME, DB_PASSWORD, DB_DATABASE, JWT_SECRET (min 16 chars)
# Variables opcionales: ver defaults abajo (CORS_ORIGIN debe ser la URL publica del ambiente).
#
# Dominio en el panel (pestana Domains): servicio `website`, puerto 80, HTTPS activado.
# Dokploy agrega las etiquetas de Traefik y su red; por eso este archivo no publica
# puertos, no declara redes externas ni etiquetas.
# El registro DNS debe existir ANTES de crear el dominio: si no, Traefik pide el
# certificado en loop y esos fallos consumen el rate limit de Let's Encrypt.
#
# Los nombres de servicio `backend` y `frontend` y el puerto 3000 NO se pueden cambiar:
# el nginx de `website` los tiene fijos como upstreams.
#
# OBLIGATORIO en el panel: Advanced > "Isolated Deployment" activado. Sin eso, `website`
# queda tambien en la red compartida `dokploy-network`, donde otros proyectos tienen
# servicios llamados `frontend`/`backend`, y nginx puede resolver esos nombres a
# contenedores ajenos.
#
# Migraciones (no corren solas): en el panel, Docker Terminal del contenedor backend:
#   sh entrypoint.sh migrate
#
# Una sola replica: el backend ejecuta tareas @Interval en proceso (deteccion de
# transmisiones y sincronizacion de sermones); escalarlo las duplicaria.
#
# Los tags son mutables (:main, :development), por eso `pull_policy: always` fuerza
# el pull en cada deploy.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/javierhuerta/church-management/backend:main}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      COVER_MAX_BYTES: ${COVER_MAX_BYTES:-10485760}
      MAX_ATTACHMENTS_PER_EVENT: ${MAX_ATTACHMENTS_PER_EVENT:-10}
      CACHE_TTL_DEFAULT: ${CACHE_TTL_DEFAULT:-60000}
      CACHE_MAX: ${CACHE_MAX:-500}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  # Admin (React+Vite) servido bajo /admin. Interno: la entrada publica es `website`.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/javierhuerta/church-management/frontend:main}
    pull_policy: always
    depends_on:
      - backend
    restart: unless-stopped

  # Sitio publico + reverse proxy: / -> sitio, /admin -> frontend,
  # /api y /uploads -> backend. Es el servicio al que apunta el dominio de Dokploy.
  website:
    image: ${WEBSITE_IMAGE:-ghcr.io/javierhuerta/church-management/website:main}
    pull_policy: always
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: ${BACKUP_RETAIN_DAYS:-7}
      BACKUP_KEEP_WEEKS: 2
      BACKUP_KEEP_MONTHS: 1
      HEALTHCHECK_PORT: 8080
    volumes:
      - backups_data:/backups
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  backups_data:
