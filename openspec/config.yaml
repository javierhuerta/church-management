schema: spec-driven

context: |
  ## Proyecto
  Sistema de gestión para la Iglesia Adventista del Séptimo Día de Osorno Central.
  La aplicación apoya las tareas administrativas, misioneras y litúrgicas de la iglesia.
  El sistema está diseñado para crecer modularmente; cada módulo es una capacidad independiente.

  ## Stack tecnológico
  - Backend: NestJS + TypeORM + PostgreSQL, API REST con OpenAPI/Swagger, autenticación JWT con roles
  - Frontend: React + Vite + shadcn/ui + Tailwind CSS, servicios generados automáticamente desde el schema OpenAPI del backend
  - Lenguaje: TypeScript en ambos lados

  Las convenciones técnicas detalladas de implementación (patrones NestJS, TypeORM, React, shadcn, etc.)
  están definidas en las skills del agente. Al implementar, cargar las skills correspondientes según el
  área del change: skills de backend para cambios en NestJS/TypeORM, skills de frontend para cambios en
  React/shadcn/Tailwind.

  Para cualquier change que incluya componentes o pantallas en el frontend, la skill `church-ui-design`
  es obligatoria. Define la paleta de colores del sistema, cómo aplicarlos (clases semánticas Tailwind
  vs style inline), la jerarquía tipográfica sin tags HTML semánticos, y el patrón mobile/desktop
  que debe seguir todo componente que muestre datos estructurados.

  ## Dominio
  La iglesia adventista tiene una estructura organizacional con roles específicos y departamentos.

  ### Roles de usuario
  - Pastor: líder principal de la iglesia
  - Anciano: líder laico, apoya al pastor
  - Coordinador Misionero: responsable de actividades de evangelismo y misión
  - Director de Departamento: responsable de un departamento específico (ej. jóvenes, familia)
  - Secretaria de Iglesia: gestión administrativa, registros de membresía
  - Maestro de Clase (Escuela Sabática): responsable de una clase de Escuela Sabática

  ### Glosario del dominio
  - Escuela Sabática: estudio bíblico que ocupa la primera parte del culto del sábado
  - Culto: servicio religioso (puede ser sabático, vespertino, semana de oración, etc.)
  - Parte del culto: segmento asignado dentro de un culto (oración, lectura, sermón, etc.)
  - Programa de iglesia: calendario de actividades planificadas
  - Miembro: persona registrada como miembro de la iglesia
  - Departamento: área de ministerio dentro de la iglesia (Jóvenes, Familia, Misionero, etc.)

  ### Módulos planificados
  - Calendario: programación de actividades y eventos de la iglesia (módulo inicial, ya existente en sistema legacy)
  - Cultos: gestión de cultos, definición de partes y asignación de responsables
  - Misión: gestión misionera, seguimiento de actividades evangelísticas
  - (más módulos se agregarán a futuro)

rules:
  proposal:
    - Incluir siempre una sección "Fuera del alcance" para delimitar el scope
    - Identificar si el change toca backend, frontend o ambos — esto determina qué skills cargar al implementar
    - Considerar impacto en roles y permisos del dominio

  tasks:
    - Las tareas deben ser accionables y completables en una sesión de trabajo
    - Ordenar de menor a mayor dependencia (infraestructura antes que UI)
    - No detallar patrones técnicos de implementación en las tareas — eso lo resuelven las skills al aplicar
    - Si el change incluye UI: agregar una tarea explícita "Cargar skill church-ui-design antes de implementar componentes" al inicio del bloque de tareas de frontend

  spec:
    - Escribir specs desde la perspectiva del usuario con su rol
    - Incluir reglas de negocio del dominio adventista cuando sean relevantes

  design: |
    Si el change incluye UI (páginas, formularios, modales, flujos de navegación), incluir siempre
    una sección "## UI Scenarios" al final del design.md. Esta sección es usada por el comando
    /qa-change para validar la UI con Playwright antes de archivar.

    Para changes con UI, el design.md debe también incluir una sección "## Diseño visual" que describa:
    - Qué colores de la paleta de marca se usarán (STATUS_COLORS, EVENT_TYPE_STYLE, NAVY, GOLD, etc.)
    - Si el componente requiere variante mobile y desktop separadas (obligatorio cuando el layout o la
      información mostrada difiere entre breakpoints)
    - Qué nivel de la jerarquía tipográfica aplica a cada texto del componente
    La skill `church-ui-design` es la referencia para estos lineamientos.

    Si el change es backend-only (sin pantallas nuevas), omitir la sección y agregar al final del
    archivo el comentario: <!-- No UI Scenarios: backend-only change -->

    Flujo de QA: /opsx-propose → /opsx-apply → /opsx-verify → /qa-change → /opsx-archive
    El comando /qa-change verifica el stack (frontend localhost:5173, backend localhost:3000),
    ejecuta los steps documentados con Playwright y genera un reporte con screenshots y veredicto PASS/FAIL.

    Formato de cada escenario en la sección UI Scenarios (ver openspec/ui-scenarios-format.md para el
    template completo con ejemplos):
    - Un encabezado ### Scenario: <nombre descriptivo>
    - Campo URL con la ruta relativa de inicio
    - Campo Description con una oración explicando qué flujo valida
    - Lista Steps con el DSL de navegación/interacción
    - Bloque ASCII Wireframe con el estado final esperado
    - Usar selectores data-testid cuando sea posible
    - Un escenario por flujo distinto (login, crear registro, ver listado, etc.)
