server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    client_max_body_size 15M;

    # El admin se sirve bajo /admin/ (Vite base=/admin/). El contenedor 'website'
    # es la entrada publica y hace proxy de /admin hacia aqui; /api y /uploads los
    # maneja 'website' directamente contra el backend.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri /admin/index.html;
    }

    # Evitar que el navegador conserve un index.html viejo del admin y
    # termine pidiendo chunks que ya no existen tras un deploy.
    location = /admin/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Acceso directo a este contenedor: redirigir a /admin/.
    location = / {
        return 301 /admin/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
