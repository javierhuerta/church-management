server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # El sidecar de imagenes del sitio (.image-slots.state.json) ronda los 20MB
    # y los uploads del backend hasta 10MB. Margen para multipart overhead.
    client_max_body_size 25M;

    # ── Sitio publico (diseno standalone React UMD + Babel) ──────────────
    # Hash routing: cualquier ruta desconocida cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # IMPORTANTE: el sidecar de imagenes es un dotfile y DEBE servirse.
    # No agregar reglas que denieguen archivos ocultos (location ~ /\.).
    location = /.image-slots.state.json {
        try_files $uri =404;
    }

    # ── Admin (SPA React+Vite, base /admin/) ─────────────────────────────
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Backend API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Archivos subidos (imagenes, adjuntos) servidos por el backend ─────
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Gzip para assets de texto (el sidecar base64 no comprime bien, pero no daña).
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/babel text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
