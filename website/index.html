<!-- Visitas anónimas con Umami propio (sin cookies). Las secciones (#galeria…) se registran desde app.jsx.
     siteTrack() guarda los eventos hasta que carga el script y también cuenta los errores de JavaScript. -->
<script>
(function () {
  var queue = [];
  window.siteTrack = function () {
    if (window.umami) window.umami.track.apply(window.umami, arguments);
    else if (queue.length < 50) queue.push(arguments);
  };
  window.siteTrackFlush = function () {
    while (window.umami && queue.length) window.umami.track.apply(window.umami, queue.shift());
  };
  function fileOf(url) { return String(url || '').split('/').pop().split('?')[0]; }
  window.addEventListener('error', function (e) {
    window.siteTrack('Error JS', { mensaje: String(e.message || 'Error').slice(0, 200), archivo: fileOf(e.filename) });
  });
  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    window.siteTrack('Error JS', { mensaje: reason.slice(0, 200), archivo: 'promesa' });
  });
})();
</script>
